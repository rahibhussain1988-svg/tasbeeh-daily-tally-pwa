<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <radialGradient id="glowGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowSmart" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with modern squircle corners -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle center glow -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad2)"/>

  <!-- Outer Tasbeeh Beads Circle (33 beads styling) -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#ffffff" stroke-width="26" stroke-dasharray="16 24" stroke-linecap="round" filter="url(#shadowSmart)"/>
  
  <!-- Inner Glass Ring -->
  <circle cx="256" cy="256" r="105" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Gold Imam Bead Accent at top -->
  <circle cx="256" cy="98" r="13" fill="#fbbf24" stroke="#ffffff" stroke-width="2.5" filter="url(#shadowSmart)"/>
  
  <!-- Central "33" Target Typography -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">33</text>
  <text x="256" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">TASBEEH</text>
</svg>
