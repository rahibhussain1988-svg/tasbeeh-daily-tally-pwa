<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Tasbeeh Beads Circle -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-width="28" stroke-dasharray="16 26" stroke-linecap="round" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Glowing Ring -->
  <circle cx="256" cy="256" r="110" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  
  <!-- Central Bead Tassel Accent -->
  <path d="M256 424 L256 460 M246 460 L266 460" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="424" r="12" fill="#f59e0b" />

  <!-- Central "33" Target Typography -->
  <text x="256" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">33</text>
  <text x="256" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">TASBEEH</text>
</svg>
